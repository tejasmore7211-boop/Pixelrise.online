let CK={cp:null,img:''};
function item(a){const L={plan:DB.plans,pack:DB.packs,store:DB.store}[a[0]]||[],p=L.find(x=>x.id==a[1]);return p&&{kind:a[0],id:p.id,name:a[0]=='plan'?p.name+' plan':(p.name||p.title),price:p.price,credits:p.credits||0}}

<div class="card sum"><h3>Order summary</h3><p>${esc(it.name)}<br><span class="mu">${cr(15)} ${it.credits} credits</span></p><table><tr><td>Price</td><td>&#8377;${it.price}</td></tr>${CK.cp?`<tr><td>Coupon ${esc(CK.cp.code)} (${CK.cp.pct}%)</td><td class="appr">-&#8377;${it.price-total(it)}</td></tr>`:''}<tr><th>Total</th><th>&#8377;${total(it)}</th></tr></table><div class="row" style="margin-top:12px"><input id="cc" placeholder="Coupon code" style="flex:1"><button class="btn" onclick="applyC()">Apply</button></div></div></div>`}
function pickSS(i){const f=i.files&&i.files[0];if(!f)return;if(!f.type||!f.type.startsWith('image/'))return toast('Please choose an image file.');if(f.size>12*1024*1024)return toast('Screenshot is too large. Choose an image under 12 MB.');const r=new FileReader();r.onerror=()=>toast('Could not read this image. Try another screenshot.');r.onload=e=>{const im=new Image();im.onerror=()=>toast('Image could not be opened. Please try a JPG or PNG screenshot.');im.onload=()=>{try{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);CK.img=c.toDataURL('image/jpeg',.55);render(true);toast('Screenshot attached. Submit the order to upload it for review.')}catch(err){console.error(err);toast('Could not prepare screenshot. Try a smaller image.')}};im.src=e.target.result};r.readAsDataURL(f)}
function applyC(){const c=DB.coupons.find(x=>x.on&&x.code==$('#cc').value.trim().toUpperCase());if(!c)return toast('Invalid or inactive coupon.');CK.cp=c;toast('Coupon applied');render(true)}
const withTimeout=(pr,ms,msg)=>{let t;return Promise.race([pr,new Promise((_,rej)=>{t=setTimeout(()=>rej(Object.assign(new Error(msg||'Request timed out'),{code:'timeout'})),ms)})]).finally(()=>clearTimeout(t))};
let ORDER_SUBMITTING=false;
async function placeO(k,id){
 if(ORDER_SUBMITTING)return toast('Your payment is already being submitted. Please wait.');
 if(!CK.img)return toast('Upload the payment screenshot first.');
 const it=item([k,id]),u=me(),fu=window.firebase&&firebase.auth&&firebase.auth().currentUser;
 if(!it||!u||!fu)return toast('Please log in again before submitting.');
 const btn=$('#submitApprovalBtn');
 ORDER_SUBMITTING=true;
 if(btn){btn.disabled=true;btn.textContent='Submitting…';btn.style.opacity='.7'}
 try{
  CK.oid=CK.oid||uid();
  const o={id:CK.oid,uid:fu.uid,kind:k,iid:id,name:it.name,credits:it.credits,amount:total(it),coupon:CK.cp?CK.cp.code:'',utr:(($('#utr')&&$('#utr').value)||'').trim(),img:CK.img,st:'pending',t:now()};
  const {img,...order}=o,up={};
  up['orders/'+fu.uid+'/'+o.id]=order;up['shots/'+fu.uid+'/'+o.id]=img;
  await withTimeout(R().update(up),15000,'Server did not respond. Check your internet and try again.');
  DB.pays=[o,...DB.pays.filter(x=>x.id!==o.id)];
  try{mark();local()}catch(e){}
  const nid=uid();
  try{R('notifs/admin/'+nid).set({id:nid,to:'admin',text:'New payment from '+u.name+' for '+it.name+' (Rs '+o.amount+')',t:now()}).catch(e=>console.warn('Admin notice not sent',e))}catch(e){}
  CK={cp:null,img:''};ORDER_SUCCESS_NOTE='Your order has been received successfully.';
  toast('Submitted successfully! Your payment is pending admin approval.');go('#/home')
 }catch(e){
  console.error('Payment upload failed',e);
  toast('Upload failed: '+(e.code||e.message)+'. '+(e.code==='PERMISSION_DENIED'?'Check Firebase Rules for orders/shots.':'Please try again.'))
 }finally{
  ORDER_SUBMITTING=false;const b=$('#submitApprovalBtn');if(b){b.disabled=false;b.textContent='Submit for approval';b.style.opacity='1'}
 }
}

async function setPaymentStatus(id,status,reason=''){
 const p=DB.pays.find(x=>String(x.id)===String(id));
 if(!p){toast('Payment order not found. Refresh Payments and try again.');return}

 const btns=[...document.querySelectorAll('button')].filter(b=>b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+id+"'"));
 btns.forEach(b=>{b.disabled=true;b.dataset.oldText=b.innerText;b.innerText='Please wait…'});
 const u=DB.users.find(x=>String(x.id)===String(p.uid));
 const stamp=now(),patch={};
 const message=status==='approved'?`Payment approved for ${p.name}. ${p.credits||0} credits added to your account.`:status==='rejected'?`Payment rejected for ${p.name}. Reason: ${reason||'Please contact support.'}`:`Payment order for ${p.name} was cancelled by admin.`;
 try{
  if(!window.firebase||!firebase.database||!firebase.auth().currentUser)throw new Error('Admin is not connected to Firebase. Please sign in again.');
  const cloudOrder={...p};delete cloudOrder.img;cloudOrder.st=status;cloudOrder.at=stamp;if(reason)cloudOrder.note=reason;
  patch[`orders/${p.uid}/${p.id}`]=cloudOrder;
  if(status==='approved'){
   const snap=await R('users/'+p.uid).once('value'),uv=snap.val()||{},oldCredits=Number(uv.credits)||0,add=Number(p.credits)||0;
   patch[`users/${p.uid}/credits`]=oldCredits+add;
   const led=ar(uv.ledger);led.unshift({n:add,why:'Purchase: '+p.name,t:stamp});patch[`users/${p.uid}/ledger`]=led.slice(0,40);
   if(p.kind==='plan'){const pl=DB.plans.find(x=>x.id===p.iid);if(pl){patch[`users/${p.uid}/plan`]=pl.id;patch[`users/${p.uid}/planExp`]=stamp+pl.days*864e5}}
   if(p.kind==='store'){const sb=DB.store.find(x=>x.id===p.iid);if(sb){const unlocked=ar(uv.unlocked);(sb.pdfs||[]).forEach(d=>{if(!unlocked.includes(d))unlocked.push(d)});patch[`users/${p.uid}/unlocked`]=unlocked}}
  }
  const nid=uid();patch[`notifs/${p.uid}/${nid}`]={id:nid,to:p.uid,text:message,t:stamp};
  await withTimeout(R().update(patch),15000,'Server did not respond. Check internet and try again.');
  p.st=status;p.at=stamp;if(reason)p.note=reason;
  if(u){if(status==='approved'){u.credits=(u.credits||0)+(Number(p.credits)||0);(u.ledger=u.ledger||[]).unshift({n:Number(p.credits)||0,why:'Purchase: '+p.name,t:stamp});u.ledger=u.ledger.slice(0,40);if(p.kind==='plan'){const pl=DB.plans.find(x=>x.id===p.iid);if(pl){u.plan=pl.id;u.planExp=stamp+pl.days*864e5}}if(p.kind==='store'){const sb=DB.store.find(x=>x.id===p.iid);if(sb)(sb.pdfs||[]).forEach(d=>{if(!(u.unlocked||[]).includes(d))(u.unlocked=u.unlocked||[]).push(d)})}}}
  mark();local();toast(status==='approved'?'Approval submitted successfully. Payment approved.':status==='rejected'?'Payment rejected successfully.':'Payment cancelled successfully.');render(true);
 }catch(e){console.error('Payment status update failed',e);toast('Could not update payment: '+(e.code||e.message||'Unknown error')+'. Check Firebase Database Rules and try again.');btns.forEach(b=>{b.disabled=false;if(b.dataset.oldText)b.innerText=b.dataset.oldText})}
}

d5:['Thumbnail hook swipe file',2,`## 40 short hooks (2 to 4 words)
Shock: STOP DOING THIS, I QUIT [TOPIC], BIG MISTAKE, IT IS A TRAP, THEY LIED
Curiosity: THE REAL REASON, NOBODY TELLS YOU, WAIT FOR THE END, SECRET TRICK, WHAT HAPPENED
Proof: [NUMBER] DAY RESULT, BEFORE AND AFTER, I TESTED IT, REAL NUMBERS, IT WORKED
Value: FREE HACK, EASY WAY, 5 MINUTE FIX, ZERO COST, BEGINNER GUIDE
Choice: THIS OR THAT, WORTH IT?, WHICH ONE?, BEST OF 2026, DO NOT BUY
## Design rules
1. One idea per thumbnail
2. Big text, maximum 4 words
3. High contrast: light text on dark or the reverse
4. A clear face or one object, no clutter
5. Leave the bottom right corner free for the video time
6. Check it at phone size before you upload
## Colour pairs that work
Navy and gold, Black and yellow, White and red, Dark green and lime, Purple and orange
## A/B test method
[ ] Make two versions that differ in only one thing
[ ] Run each for 48 hours
[ ] Keep the one with the higher click rate
[ ] Write down what you learned
> The title and thumbnail should work together. The thumbnail shows the feeling, the title gives the details.`],
d7:['Real estate lead follow-up scripts',3,`> Most deals are lost in follow-up, not in the first meeting. Reply within 5 minutes.
## First call script
1. Greet and confirm: Hello Sir, this is [name] from [company]. You enquired about [project]. Is this a good time?
2. Ask 4 questions: budget, location, size, and when they want to buy
3. Ask: Is this for self use or investment?
4. Offer: I will send 3 options that match. Can I share on WhatsApp?
## WhatsApp follow-up sequence
Day 0: Thank you for your enquiry. Here are 3 options within your budget: [links]
Day 1: Did you get a chance to see the options? Which one looked best?
Day 3: A site visit is open this Saturday. Shall I book a slot for you?
Day 7: Prices in [area] are moving. Happy to share the latest rate card.
Day 15: One new listing just came that matches your need. Want details?
## Site visit checklist
[ ] Confirm time and send the location pin one day before
[ ] Keep brochure, price sheet and payment plan printed
[ ] Pick up the client or guide the route
[ ] Show the sample flat, the exact unit and the surroundings
[ ] Note their questions and reactions
[ ] Send a thank you message within 2 hours
## Handling objections
Price is high: Compare the rate on carpet area with 2 nearby projects and show the amenities included
Need to discuss at home: Offer to send a short summary and invite the family to the next visit
Comparing other projects: Ask what they like in the other one and answer on that point
Will decide later: Share the date a price or offer ends, honestly and without pressure
## Closing
[ ] Summarise what they liked
[ ] Explain the booking amount and next steps
[ ] Give the document list for the booking
> Never promise returns or approvals you cannot guarantee. Trust brings referrals.`],
d8:['Property buyer due diligence checklist',3,`> A general checklist for buyers and agents. Rules differ by state, so confirm with a local lawyer.
## Ownership documents
[ ] Sale deed or allotment letter in the seller's name
[ ] Chain of previous deeds for the last 30 years if resale
[ ] Mutation entry and property tax receipts
[ ] Encumbrance certificate to confirm no loans or disputes
## Builder and project (new property)
[ ] RERA registration number checked on the state RERA site
[ ] Approved building plan and commencement certificate
[ ] Occupancy or completion certificate for ready homes
[ ] Builder track record and delivery of earlier projects
## Society and resale
[ ] Society NOC and no dues certificate
[ ] Share certificate and maintenance dues
[ ] Electricity and water bills cleared
## Area and measurements
[ ] Carpet area in the agreement matches the RERA carpet area
[ ] Loading percentage understood and compared
[ ] Parking and common area rights written in the agreement
## Money checks
[ ] Payment schedule linked to construction stages
[ ] Pay only by cheque or bank transfer, keep every receipt
[ ] Total cost including stamp duty, registration, GST and maintenance deposit
[ ] Home loan sanction before paying a large booking amount
## Registration day
1. Verify all originals once more
2. Pay stamp duty and registration fee
3. Both parties and witnesses present with ID
4. Collect the registered deed and the receipt
## Red flags
- Seller refuses to show originals
- Price far below the market
- No RERA number on ads
- Pressure to pay cash
> A lawyer's fee is small compared with a property dispute.`],
d9:['Home loan file checklist and FOIR cheat sheet',3,`> For loan agents, DSAs and bank staff who prepare customer files.
## Quick eligibility formula (FOIR)
Max EMI = (Net monthly income x FOIR %) - existing EMIs
Example: income Rs 80,000, FOIR 50%, existing EMI Rs 10,000
Max EMI = 40,000 - 10,000 = Rs 30,000
Loan amount = Max EMI divided by EMI per rupee for the rate and tenure
Use the EMI Calculator and Loan Eligibility tools in PixelRise.
## Documents: salaried
[ ] PAN and Aadhaar
[ ] Last 3 months salary slips and Form 16
[ ] Last 6 months salary account statement
[ ] Employment proof and ID card
## Documents: self-employed
[ ] PAN, Aadhaar and business registration
[ ] ITR with computation for last 2 to 3 years
[ ] Balance sheet and P&L
[ ] GST returns and 12 months bank statements
## Property documents
[ ] Sale agreement or allotment letter
[ ] Title documents and approved plan
[ ] Builder payment receipts and NOC
## Common reasons for rejection
- Low credit score or recent missed EMIs
- Too many loan enquiries in a short time
- Income not matching bank credits
- Property with unclear title or no approvals
- Existing EMIs taking too much of the income
## Improving a weak file
1. Add a co-applicant with steady income
2. Close small loans and credit card dues first
3. Show additional income with proof
4. Reduce the loan amount or increase the tenure
## Customer communication
[ ] Explain the interest rate type, fees and prepayment rules clearly
[ ] Give a written list of documents in one message
[ ] Update the customer at every stage of the file
> A complete file the first time is the fastest way to a sanction.`]};

 const settle=bad=>{bad.forEach(b=>{if(soft(b[0]))LAST[b[0]]=J(P[b[0]]);else delete LAST[b[0]]});const hard=bad.filter(b=>!soft(b[0]));if(hard.length&&Date.now()-(window.__sf||0)>20000){window.__sf=Date.now();toast('Cloud sync failed ('+hard[0][0].split('/').slice(0,3).join('/')+'): '+(hard[0][1].code||hard[0][1].message))}};
 try{R().update(U).catch(async()=>{const bad=[];await Promise.all(ks.map(k=>R(k).set(U[k]).catch(x=>bad.push([k,x]))));settle(bad)})}catch(e){ks.forEach(k=>delete LAST[k]);console.error(e)}}}
let READY=false,rs;const ready=new Promise(r=>rs=r);let gs=false,gc=false;
const gate=()=>{if(gs&&gc){READY=true;rs()}};
const pull=f=>{PULL=true;try{f()}catch(e){console.error(e)}PULL=false;mark();local();redraw()};
save=()=>{local();if(!PULL)push()};
/* expose helpers used by code outside this block (payments, announcements) */
window.R=R;window.ar=ar;window.mark=mark;window.local=local;
/* public data: settings + catalog (everyone) */
R('settings').on('value',s=>{const v=s.val();if(v)pull(()=>Object.assign(DB.set,v));gs=true;gate()},()=>{gs=true;gate()});
R('catalog').on('value',s=>{const v=s.val();if(v)pull(()=>{['plans','packs','store','pdfs','coupons'].forEach(k=>{if(v[k]!==undefined)DB[k]=ar(v[k])});if(v.tools)DB.tools=Object.assign(DB.tools||{},v.tools)});gc=true;gate()},()=>{gc=true;gate()});
const on=(p,f)=>{const r=R(p);r.on('value',s=>pull(()=>f(s.val())),e=>{LOADED=true;console.warn(p,e.message);try{render(true)}catch(x){}});offs.push(()=>r.off())};
const mk=(id,v)=>{const p=v.profile||{};return{id,name:p.name||'',username:p.username||'',phone:p.phone||'',pass:'',exam:p.exam||'',credits:v.credits||0,plan:v.plan||'',planExp:v.planExp||0,joined:p.joined||0,pref:p.pref||{theme:'light',goal:4},tasks:ar(p.tasks),hist:ar(v.hist),unlocked:ar(v.unlocked),ledger:ar(v.ledger),seen:p.seen||0,banned:!!v.banned,g:v.growth||{}}};
function detach(){offs.forEach(f=>f());offs=[]}
async function seed(){const s=await R('catalog').once('value');if(s.exists())return;const P=paths(),U={};for(const k in P)if(k=='settings'||k.startsWith('catalog/')){U[k]=JSON.parse(J(P[k]));LAST[k]=J(P[k])}R('').update(U).catch(e=>toast('Cloud seed failed: '+(e.code||e.message)))}
async function attachAdmin(){detach();await ready;await seed();let OR=null,SH={};
 const pays=()=>{DB.pays=fl(OR).map(p=>({...p,img:(SH[p.uid]||{})[p.id]||''})).sort((a,b)=>b.t-a.t)};
 on('users',v=>{DB.users=Object.entries(v||{}).map(([id,x])=>mk(id,x)).sort((a,b)=>b.joined-a.joined)});
 on('orders',v=>{OR=v;pays()});on('shots',v=>{SH=v||{};pays()});
 on('notifs',v=>{DB.notifs=fl(v).sort((a,b)=>b.t-a.t)})}
async function attachUser(){detach();await ready;const id=uidv;
 on('users/'+id,v=>{LOADED=true;if(v){DB.users=[mk(id,v)];if(v.banned){toast('This account is suspended.');au.signOut()}}});
 on('orders/'+id,v=>{DB.pays=Object.values(v||{}).sort((a,b)=>b.t-a.t)});
 let N1={},N2={};const nn=()=>{DB.notifs=[...Object.values(N1||{}),...Object.values(N2||{})].sort((a,b)=>b.t-a.t)};
 on('notifs/'+id,v=>{N1=v;nn()});on('notifs/all',v=>{N2=v;nn()})}
au.onAuthStateChanged(usr=>{if(SIGNING)return;detach();LAST={};
 if(!usr){LOADED=true;uidv=null;AD=false;LS.set('pixelrise_admin_v1','');if(SS.uid){SS={};saveS();DB.users=[];DB.pays=[];DB.notifs=[];local();redraw()}return}
 if(!LS.get('pr_fb')){DB.users=[];DB.pays=[];DB.notifs=[];LS.set('pr_fb','1')}
 if(usr.uid===ADMIN){AD=true;uidv=null;LS.set('pixelrise_admin_v1','1');attachAdmin()}
 else{AD=false;uidv=usr.uid;SS={uid:usr.uid};LS.set('pr_acct','1');saveS();attachUser()}});
const ERR=e=>({'auth/email-already-in-use':'Username already registered.','auth/invalid-credential':'Username or password is wrong.','auth/wrong-password':'Password is wrong.','auth/user-not-found':'No account found. Check the spelling or sign up.','auth/network-request-failed':'No internet connection.','auth/too-many-requests':'Too many attempts. Try again later.'}[e.code]||('Error: '+(e.code||e.message)));
window.doSignup=async function(){
 if(hasAcct()){toast('An account already exists on this device. Please log in.');return goR('#/login')}
 const n=$('#sn').value.trim(),u=$('#su').value.trim(),p=$('#sp').value.replace(/\D/g,''),w=$('#sw').value;
 if(!n||!u)return toast('Enter name and username.');
 if(!/^[A-Za-z0-9._-]{3,30}$/.test(u))return toast('Username: 3 to 30 letters, numbers, dot, dash or underscore only.');
 if(!/^\d{10}$/.test(p))return toast('Enter a valid 10 digit mobile number.');
 if(w.length<6)return toast('Password must be 6+ characters.');
 SIGNING=true;
 try{
  await ready;
  let c;
  try{c=await au.createUserWithEmailAndPassword(u.toLowerCase()+DOM,w)}
  catch(e){
   // If an earlier attempt created the Auth user but failed while saving the profile/index,
   // sign into that same account and finish the missing setup instead of trapping the user.
   if(e.code==='auth/email-already-in-use') c=await au.signInWithEmailAndPassword(u.toLowerCase()+DOM,w); else throw e;
  }
  uidv=c.user.uid;SS={uid:uidv};AD=false;
  const old=await R('users/'+uidv).once('value');
  const prev=old.val()||{};
  const profile=prev.profile||{name:n,username:u,phone:p,exam:$('#se').value,joined:now(),seen:now(),pref:{theme:'light',goal:4},tasks:[]};
  if(!profile.name)profile.name=n;if(!profile.username)profile.username=u;if(!profile.phone)profile.phone=p;
  const patch={};patch['users/'+uidv+'/profile']=profile;
  if(prev.credits===undefined)patch['users/'+uidv+'/credits']=Number(DB.set.signupCredits)||30;
  if(prev.unlocked===undefined)patch['users/'+uidv+'/unlocked']=[];
  if(prev.ledger===undefined)patch['users/'+uidv+'/ledger']=prev.credits===undefined?[{n:Number(DB.set.signupCredits)||30,why:'Signup bonus',t:now()}]:[];
  if(prev.hist===undefined)patch['users/'+uidv+'/hist']=[];
  await R('').update(patch);
  // Phone index is a convenience for phone login; do not fail account creation if rules omit idx write access.
  try{await R('idx/'+p).set(u.toLowerCase())}catch(idxErr){console.warn('Phone index write blocked; username login remains available.',idxErr)}
  DB.users=[mk(uidv,{...prev,profile,credits:patch['users/'+uidv+'/credits']??prev.credits??0,unlocked:prev.unlocked||[],ledger:prev.ledger||[],hist:prev.hist||[]})];
  DB.pays=[];DB.notifs=[];READY=true;LS.set('pr_fb','1');LS.set('pr_acct','1');saveS();mark();
  SIGNING=false;attachUser();goR('#/dashboard');toast('Account ready. Welcome, '+n);
 }catch(e){SIGNING=false;console.error('Signup setup failed',e);toast(ERR(e)+' If the account was partly created, log in with the same username and password to finish setup.');}
};
window.doLogin=async function(){
 const a=$('#lu').value.trim().toLowerCase(),pr=$('#lp').value;
 if(!a||!pr)return toast('Enter your username or mobile number and password.');
 try{
  await ready;let un=a;
  if(/^\d{10}$/.test(a)){const ix=await R('idx/'+a).once('value');if(!ix.exists())return toast('No phone index found. Try your username instead, or check Firebase Rules for idx access.');un=ix.val()}
  const cred=await au.signInWithEmailAndPassword(un+DOM,pr),id=cred.user.uid;
  uidv=id;SS={uid:id};AD=false;LS.set('pr_acct','1');saveS();
  // Hydrate profile before changing route; otherwise the route guard can bounce back to login.
  const snap=await R('users/'+id).once('value'),v=snap.val();
  if(v){DB.users=[mk(id,v)];DB.pays=[];DB.notifs=[];}
  attachUser();
  // Let the auth state/profile listeners settle before render checks me().
  if(!DB.users.some(x=>x.id===id))DB.users=[mk(id,v||{})];
  toast('Welcome back');goR('#/dashboard');
 }catch(e){console.error('Login failed',e);toast(ERR(e))}
};
window.doAdmin=async function(){const id=$('#ai').value.trim(),c=$('#ac').value;
 try{const r=await au.signInWithEmailAndPassword(id,c);if(r.user.uid!==ADMIN){await au.signOut();return toast('This is not the admin account.')}AD=true;go('#/admin')}catch(e){toast('Incorrect admin email or password.')}};
